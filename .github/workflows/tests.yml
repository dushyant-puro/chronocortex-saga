name: Runtime regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-security.txt
            requirements/manifest.json
      - run: python -m venv .venv
      - run: python -c "from pathlib import Path; Path('results').mkdir(exist_ok=True)"
      - run: >-
          .venv/bin/python -m pip --isolated --disable-pip-version-check install
          --require-hashes --only-binary=:all: --report results/install-security.json -r requirements-security.txt
      - run: .venv/bin/python -m scripts.dependency_audit --profile security --output results/environment-security.json
      - run: .venv/bin/python -m pip --isolated --disable-pip-version-check download --no-deps --require-hashes --only-binary=:all: --dest results/wheel-source -r requirements-security.txt
      - run: .venv/bin/python -m scripts.wheelhouse capture --profile security --source results/wheel-source --output results/offline-wheels
      - run: .venv/bin/python -m scripts.wheelhouse verify --profile security --directory results/offline-wheels
      - run: .venv/bin/python -m scripts.advisory_audit --output results/dependency-advisories.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-advisories
          path: |
            results/install-security.json
            results/environment-security.json
            results/dependency-advisories.json
            results/offline-wheels/wheelhouse.json
          if-no-files-found: ignore
          retention-days: 7

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/manifest.json
      - run: python -m venv .venv
      - run: python -c "from pathlib import Path; Path('results').mkdir(exist_ok=True)"
      - run: >-
          ${{ matrix.python }} -m pip --isolated --disable-pip-version-check install
          --require-hashes --only-binary=:all: --report results/install-runtime.json -r requirements.txt
      - run: ${{ matrix.python }} -m pip --isolated check
      - run: ${{ matrix.python }} -m scripts.dependency_audit --profile runtime --output results/environment-runtime.json
      - run: ${{ matrix.python }} -m pip --isolated --disable-pip-version-check download --no-deps --require-hashes --only-binary=:all: --dest results/wheel-source -r requirements.txt
      - run: ${{ matrix.python }} -m scripts.wheelhouse capture --profile runtime --source results/wheel-source --output results/offline-wheels
      - run: ${{ matrix.python }} -m scripts.wheelhouse verify --profile runtime --directory results/offline-wheels
      - run: ${{ matrix.python }} -m pytest -q -p no:cacheprovider
      - run: ${{ matrix.python }} -m eval.voice_replay --output results/voice-evidence-scorecard.json
      - run: ${{ matrix.python }} -m eval.provider_faults --output results/provider-process-scorecard.json
      - run: ${{ matrix.python }} -m eval.mutation_comparison --output results/mutation-comparison.json
      - run: ${{ matrix.python }} -m eval.durable_tasks --output results/durable-tasks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-evidence-runtime-${{ matrix.os }}
          path: |
            results/install-runtime.json
            results/environment-runtime.json
            results/offline-wheels/wheelhouse.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulated-voice-evidence-${{ matrix.os }}
          path: results/voice-evidence-scorecard.json
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulated-provider-process-${{ matrix.os }}
          path: results/provider-process-scorecard.json
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulated-mutation-comparison-${{ matrix.os }}
          path: results/mutation-comparison.json
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulated-durable-tasks-${{ matrix.os }}
          path: results/durable-tasks.json
          if-no-files-found: ignore
          retention-days: 7

  browser:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-browser.txt
            requirements/manifest.json
      - run: python -m venv .venv
      - run: python -c "from pathlib import Path; Path('results').mkdir(exist_ok=True)"
      - run: >-
          ${{ matrix.python }} -m pip --isolated --disable-pip-version-check install
          --require-hashes --only-binary=:all: --report results/install-browser.json -r requirements-browser.txt
      - run: ${{ matrix.python }} -m pip --isolated check
      - run: ${{ matrix.python }} -m scripts.dependency_audit --profile browser --output results/environment-browser.json
      - run: ${{ matrix.python }} -m pip --isolated --disable-pip-version-check download --no-deps --require-hashes --only-binary=:all: --dest results/wheel-source -r requirements-browser.txt
      - run: ${{ matrix.python }} -m scripts.wheelhouse capture --profile browser --source results/wheel-source --output results/offline-wheels
      - run: ${{ matrix.python }} -m scripts.wheelhouse verify --profile browser --directory results/offline-wheels
      - run: ${{ matrix.python }} -m playwright install --with-deps chromium
      - run: ${{ matrix.python }} -m pytest browser/console_cases.py -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-evidence-browser-${{ matrix.os }}
          path: |
            results/install-browser.json
            results/environment-browser.json
            results/offline-wheels/wheelhouse.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-visual-${{ matrix.os }}
          path: results/console-visual/
          if-no-files-found: ignore
          retention-days: 7
