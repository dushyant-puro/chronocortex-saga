name: Runtime regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q -p no:cacheprovider

  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m pip check
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest browser/console_cases.py -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-visual-${{ matrix.os }}
          path: results/console-visual/
          if-no-files-found: ignore
          retention-days: 7
